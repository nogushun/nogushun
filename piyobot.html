<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>piyobot 管理パネル</title>
  <style>
    :root {
      --bg-color: #0c0c0e;
      --sidebar-bg: #121216;
      --card-bg: #18181c;
      --card-border: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --log-bg: #09090b;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    /* サイドメニュー（固定配置） */
    aside {
      width: 260px;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      box-sizing: border-box;
      z-index: 100;
    }

    .sidebar-brand {
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-menu li a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .sidebar-menu li a:hover, .sidebar-menu li.active a {
      background-color: #27272a;
      color: #ffffff;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
    }

    /* メインコンテンツエリア（サイドバーの幅分マージンを空ける） */
    main {
      flex: 1;
      margin-left: 260px;
      padding: 40px;
      box-sizing: border-box;
      max-width: 900px;
    }

    header {
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 1.8rem;
      margin: 0 0 6px 0;
      color: #ffffff;
    }

    header p {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.95rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      scroll-margin-top: 40px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      color: #e4e4e7;
    }

    .status-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      margin-right: 6px;
    }

    .status-text {
      font-size: 0.95rem;
      margin-bottom: 16px;
      color: var(--text-muted);
    }

    .status-text strong {
      color: var(--text-main);
    }

    /* フォーム要素 */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-input, .form-textarea {
      width: 100%;
      background-color: var(--log-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--accent-blue);
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn {
      background-color: #27272a;
      color: var(--text-main);
      border: 1px solid #3f3f46;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-danger {
      color: var(--accent-red);
    }
    .btn-danger:hover {
      background-color: var(--accent-red);
      color: #ffffff;
      border-color: var(--accent-red);
    }

    .btn-blue {
      background-color: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }
    .btn-blue:hover {
      background-color: #2563eb;
    }

    /* ログコンテナ */
    .log-container {
      background-color: var(--log-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      max-height: 320px;
      overflow-y: auto;
    }

    .log-container::-webkit-scrollbar {
      width: 8px;
    }
    .log-container::-webkit-scrollbar-track {
      background: var(--log-bg);
    }
    .log-container::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }

    .log-item {
      margin-bottom: 10px;
      line-height: 1.6;
      color: #d4d4d8;
      word-break: break-all;
    }

    .log-item:last-child {
      margin-bottom: 0;
    }

    .log-time {
      color: #71717a;
      margin-right: 8px;
    }

    .log-item strong {
      color: #ffffff;
    }

    /* レスポンシブ対応 */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      aside {
        position: relative;
        width: 100%;
        height: auto;
      }
      main {
        margin-left: 0;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- 左側サイドメニュー（固定配置） -->
  <aside>
    <div class="sidebar-brand">
      🐤 piyobot
    </div>
    <ul class="sidebar-menu">
      <li class="active"><a href="#status-card">📊 ダッシュボード</a></li>
      <li><a href="#custom-message-card">💬 カスタムメッセージ</a></li>
      <li><a href="#log-card">📜 稼働ログ</a></li>
      <li style="margin-top: 12px;"><a href="./">← メイン管理に戻る</a></li>
    </ul>
    <div class="sidebar-footer">
      <span style="font-size: 0.8rem; color: var(--text-muted);">Status: Online</span>
    </div>
  </aside>

  <!-- メインコンテンツエリア -->
  <main>
    <header>
      <h1>管理ダッシュボード</h1>
      <p>piyobot の稼働ステータス監視、Discordメッセージ送信、リアルタイムログ確認を行います。</p>
    </header>

    <!-- ボットステータス制御 -->
    <div class="card" id="status-card">
      <h2>ボットステータス制御</h2>
      <div class="status-text">
        現在の状態: <span class="status-badge" id="status-badge"></span><strong id="status-label">有効 (稼働中)</strong>
      </div>
      <button class="btn btn-danger" id="toggle-btn">ボットを停止する</button>
    </div>

    <!-- カスタムメッセージ送信フォーム -->
    <div class="card" id="custom-message-card">
      <h2>カスタムメッセージ送信</h2>
      <div class="form-group">
        <label for="channel-id-input">送信先チャンネルID</label>
        <input type="text" id="channel-id-input" class="form-input" placeholder="例: 123456789012345678" />
      </div>
      <div class="form-group">
        <label for="message-input">メッセージ内容</label>
        <textarea id="message-input" class="form-textarea" placeholder="Discordに送信するメッセージを入力してください..."></textarea>
      </div>
      <button class="btn btn-blue" id="send-msg-btn">Discordに送信</button>
    </div>

    <!-- 最新の稼働ログ -->
    <div class="card" id="log-card">
      <h2>リアルタイム稼働ログ</h2>
      <div class="log-container" id="log-list">
        <div class="log-item" style="color: var(--text-muted);">ログを読み込んでいます...</div>
      </div>
    </div>
  </main>

  <!-- Firebase SDK (Modular v10+) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      query, 
      orderBy, 
      limit, 
      onSnapshot,
      doc,
      setDoc,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase設定情報
    const firebaseConfig = {
      apiKey: "AIzaSyD4xg5pQ92oyb37YJfA3e3KmGN1q0-ThIQ",
      authDomain: "mywebsite-72df0.firebaseapp.com",
      projectId: "mywebsite-72df0",
      storageBucket: "mywebsite-72df0.firebasestorage.app",
      messagingSenderId: "538159276455",
      appId: "1:538159276455:web:3b61ea7c2b427ee6c11682",
      measurementId: "G-XGGF1946BT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const logListEl = document.getElementById("log-list");
    const toggleBtn = document.getElementById("toggle-btn");
    const statusBadge = document.getElementById("status-badge");
    const statusLabel = document.getElementById("status-label");
    const sendMsgBtn = document.getElementById("send-msg-btn");
    const channelInput = document.getElementById("channel-id-input");
    const messageInput = document.getElementById("message-input");

    // 1. リアルタイムログ監視
    const q = query(
      collection(db, "bot_logs"), 
      orderBy("timestamp", "desc"), 
      limit(20)
    );

    onSnapshot(q, (snapshot) => {
      logListEl.innerHTML = "";

      if (snapshot.empty) {
        logListEl.innerHTML = '<div class="log-item" style="color: var(--text-muted);">ログはありません。</div>';
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        let timeStr = "";
        if (data.timestamp && data.timestamp.toDate) {
          const date = data.timestamp.toDate();
          timeStr = `[${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}]`;
        } else if (typeof data.timestamp === 'string') {
          timeStr = `[${data.timestamp}]`;
        } else {
          timeStr = `[直近]`;
        }

        let messageHtml = (data.message || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        const logItem = document.createElement("div");
        logItem.className = "log-item";
        logItem.innerHTML = `<span class="log-time">${timeStr}</span> ${messageHtml}`;
        
        logListEl.appendChild(logItem);
      });
    });

    // 2. ボットステータス制御
    let isRunning = true;
    const statusRef = doc(db, "settings", "bot_status");

    onSnapshot(statusRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        isRunning = data.running !== false;
      } else {
        setDoc(statusRef, { running: true });
        isRunning = true;
      }

      if (isRunning) {
        statusBadge.style.backgroundColor = "var(--accent-green)";
        statusBadge.style.boxShadow = "0 0 8px var(--accent-green)";
        statusLabel.textContent = "有効 (稼働中)";
        toggleBtn.textContent = "ボットを停止する";
      } else {
        statusBadge.style.backgroundColor = "var(--accent-red)";
        statusBadge.style.boxShadow = "0 0 8px var(--accent-red)";
        statusLabel.textContent = "停止中";
        toggleBtn.textContent = "ボットを再開する";
      }
    });

    toggleBtn.addEventListener("click", async () => {
      try {
        const nextState = !isRunning;
        await setDoc(statusRef, { running: nextState }, { merge: true });
      } catch (e) {
        alert("ステータスの変更に失敗しました。");
      }
    });

    // 3. WebからDiscordへのメッセージ送信処理
    sendMsgBtn.addEventListener("click", async () => {
      const channelId = channelInput.value.trim();
      const content = messageInput.value.trim();

      if (!channelId || !content) {
        alert("チャンネルIDとメッセージ内容の両方を入力してください。");
        return;
      }

      try {
        sendMsgBtn.disabled = true;
        sendMsgBtn.textContent = "送信中...";

        await addDoc(collection(db, "send_requests"), {
          channelId: channelId,
          content: content,
          status: "pending",
          createdAt: serverTimestamp()
        });

        messageInput.value = "";
        alert("Discordへの送信リクエストを送信しました！");
      } catch (error) {
        console.error("送信エラー:", error);
        alert("送信リクエストの追加に失敗しました。");
      } finally {
        sendMsgBtn.disabled = false;
        sendMsgBtn.textContent = "Discordに送信";
      }
    });
  </script>
</body>
</html>
