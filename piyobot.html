<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>piyobot 管理パネル</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #09090b;
      --card-border: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --log-bg: #030305;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2rem;
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #ffffff;
    }

    header p {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.95rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .card h2 {
      font-size: 1.15rem;
      margin-top: 0;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      color: #e4e4e7;
    }

    .status-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      margin-right: 6px;
    }

    .status-text {
      font-size: 0.95rem;
      margin-bottom: 16px;
      color: var(--text-muted);
    }

    .status-text strong {
      color: var(--text-main);
    }

    .btn {
      background-color: #18181b;
      color: var(--accent-red);
      border: 1px solid #3f3f46;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: var(--accent-red);
      color: #ffffff;
      border-color: var(--accent-red);
    }

    .log-container {
      background-color: var(--log-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      max-height: 380px;
      overflow-y: auto;
    }

    /* カスタムスクロールバー */
    .log-container::-webkit-scrollbar {
      width: 8px;
    }
    .log-container::-webkit-scrollbar-track {
      background: #030305;
    }
    .log-container::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    .log-container::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    .log-item {
      margin-bottom: 10px;
      line-height: 1.6;
      color: #d4d4d8;
      word-break: break-all;
    }

    .log-item:last-child {
      margin-bottom: 0;
    }

    .log-time {
      color: #71717a;
      margin-right: 8px;
    }

    .log-item strong {
      color: #ffffff;
    }

    footer {
      text-align: center;
      margin-top: 32px;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    footer a:hover {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🐤 piyobot 管理パネル</h1>
      <p>Discordボットの稼働状態やログをリアルタイムで管理します。</p>
    </header>

    <!-- ボットステータス制御 -->
    <div class="card">
      <h2>ボットステータス制御</h2>
      <div class="status-text">
        現在の状態: <span class="status-badge" id="status-badge"></span><strong id="status-label">有効 (稼働中)</strong>
      </div>
      <button class="btn" id="toggle-btn">ボットを停止する</button>
    </div>

    <!-- 最新の稼働ログ -->
    <div class="card">
      <h2>最新の稼働ログ</h2>
      <div class="log-container" id="log-list">
        <div class="log-item" style="color: var(--text-muted);">ログを読み込んでいます...</div>
      </div>
    </div>

    <footer>
      <a href="./">← 管理者ページに戻る</a>
    </footer>
  </div>

  <!-- Firebase SDK (Modular v10+) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      query, 
      orderBy, 
      limit, 
      onSnapshot,
      doc,
      setDoc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. 正しいFirebase設定情報
    const firebaseConfig = {
      apiKey: "AIzaSyD4xg5pQ92oyb37YJfA3e3KmGN1q0-ThIQ",
      authDomain: "mywebsite-72df0.firebaseapp.com",
      projectId: "mywebsite-72df0",
      storageBucket: "mywebsite-72df0.firebasestorage.app",
      messagingSenderId: "538159276455",
      appId: "1:538159276455:web:3b61ea7c2b427ee6c11682",
      measurementId: "G-XGGF1946BT"
    };

    // Firebase初期化
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const logListEl = document.getElementById("log-list");
    const toggleBtn = document.getElementById("toggle-btn");
    const statusBadge = document.getElementById("status-badge");
    const statusLabel = document.getElementById("status-label");

    // 2. Firestoreの 'bot_logs' コレクションをリアルタイム監視（onSnapshot）
    const q = query(
      collection(db, "bot_logs"), 
      orderBy("timestamp", "desc"), 
      limit(20)
    );

    onSnapshot(q, (snapshot) => {
      logListEl.innerHTML = "";

      if (snapshot.empty) {
        logListEl.innerHTML = '<div class="log-item" style="color: var(--text-muted);">ログはありません。</div>';
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        
        // タイムスタンプのフォーマット処理
        let timeStr = "";
        if (data.timestamp && data.timestamp.toDate) {
          const date = data.timestamp.toDate();
          timeStr = `[${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}]`;
        } else if (typeof data.timestamp === 'string') {
          timeStr = `[${data.timestamp}]`;
        } else {
          timeStr = `[直近]`;
        }

        // マークダウン太字(** text **)をHTMLの <strong> タグに変換
        let messageHtml = (data.message || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        // ログ要素の追加
        const logItem = document.createElement("div");
        logItem.className = "log-item";
        logItem.innerHTML = `<span class="log-time">${timeStr}</span> ${messageHtml}`;
        
        logListEl.appendChild(logItem);
      });
    }, (error) => {
      console.error("Firestoreリアルタイム取得エラー:", error);
      logListEl.innerHTML = '<div class="log-item" style="color:var(--accent-red);">ログの取得に失敗しました（権限または接続エラー）。</div>';
    });

    // 3. ボットの稼働状態（停止/開始ボタン）のリアルタイム監視と切り替え処理
    let isRunning = true;
    const statusRef = doc(db, "settings", "bot_status");

    // ステータス変更の監視
    onSnapshot(statusRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        isRunning = data.running !== false; // デフォルトは true
      } else {
        // ドキュメントがなければ初期作成
        setDoc(statusRef, { running: true });
        isRunning = true;
      }

      // UIの反映
      if (isRunning) {
        statusBadge.style.backgroundColor = "var(--accent-green)";
        statusBadge.style.boxShadow = "0 0 8px var(--accent-green)";
        statusLabel.textContent = "有効 (稼働中)";
        toggleBtn.textContent = "ボットを停止する";
      } else {
        statusBadge.style.backgroundColor = "var(--accent-red)";
        statusBadge.style.boxShadow = "0 0 8px var(--accent-red)";
        statusLabel.textContent = "停止中";
        toggleBtn.textContent = "ボットを再開する";
      }
    });

    // ボタンをクリックしたときの処理
    toggleBtn.addEventListener("click", async () => {
      try {
        const nextState = !isRunning;
        await setDoc(statusRef, { running: nextState }, { merge: true });
      } catch (e) {
        console.error("ステータスの変更に失敗しました:", e);
        alert("ステータスの変更に失敗しました。");
      }
    });
  </script>
</body>
</html>
