<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>piyobot 管理パネル</title>
  <style>
    :root {
      --bg-color: #0c0c0e;
      --sidebar-bg: #121216;
      --card-bg: #18181c;
      --card-border: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --log-bg: #09090b;
      --input-bg: #121215;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    /* 固定サイドメニュー */
    aside {
      width: 260px;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      box-sizing: border-box;
      z-index: 100;
    }

    .sidebar-brand {
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-menu li button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      color: var(--text-muted);
      background: none;
      border: none;
      text-align: left;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sidebar-menu li button:hover, .sidebar-menu li.active button {
      background-color: #27272a;
      color: #ffffff;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
    }

    /* メインコンテンツエリア */
    main {
      flex: 1;
      margin-left: 260px;
      padding: 40px;
      box-sizing: border-box;
      max-width: 900px;
    }

    header {
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 1.8rem;
      margin: 0 0 6px 0;
      color: #ffffff;
    }

    header p {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.95rem;
    }

    /* 画面切り替えセクション */
    .content-section {
      display: none;
    }
    .content-section.active {
      display: block;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      color: #e4e4e7;
    }

    .status-badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      margin-right: 6px;
    }

    .status-text {
      font-size: 0.95rem;
      margin-bottom: 16px;
      color: var(--text-muted);
    }

    .status-text strong {
      color: var(--text-main);
    }

    /* フォーム要素 */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* ブラック仕様カスタムカラー選択エリア */
    .color-picker-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .color-preview-box {
      width: 44px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background-color: #32CD32;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .color-preview-box:hover {
      border-color: #3f3f46;
    }

    /* ネイティブのカラーピッカーを透明にして重ねることでブラウザ標準のポップアップを維持しつつ見た目を完全ブラック化 */
    .color-input-native {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 64px;
      height: 60px;
      opacity: 0;
      cursor: pointer;
    }

    .color-text-input {
      flex: 1;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      font-family: monospace;
      transition: border-color 0.2s;
    }

    .color-text-input:focus {
      border-color: var(--accent-blue);
    }

    /* カラーテンプレート（プリセット）ボタン一覧 */
    .color-presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .color-preset-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-preset-btn:hover {
      transform: scale(1.1);
      border-color: #ffffff;
    }

    /* カスタムドロップダウン */
    .custom-select-container {
      position: relative;
      user-select: none;
    }

    .custom-select-trigger {
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .custom-select-trigger:hover {
      border-color: #3f3f46;
    }

    .custom-select-trigger::after {
      content: '▾';
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .custom-select-container.open .custom-select-trigger::after {
      transform: rotate(180deg);
    }

    .custom-select-options {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background-color: #1c1c21;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
      max-height: 240px;
      overflow-y: auto;
      z-index: 999;
      display: none;
    }

    .custom-select-container.open .custom-select-options {
      display: block;
    }

    .custom-option {
      padding: 12px 16px;
      font-size: 0.92rem;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      transition: background-color 0.15s, color 0.15s;
    }

    .custom-option:last-child {
      border-bottom: none;
    }

    .custom-option:hover, .custom-option.selected {
      background-color: #27272a;
      color: #ffffff;
    }

    .form-textarea {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      resize: vertical;
      min-height: 120px;
      transition: border-color 0.2s;
    }

    .form-textarea:focus {
      border-color: var(--accent-blue);
    }

    .btn {
      background-color: #27272a;
      color: var(--text-main);
      border: 1px solid #3f3f46;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-danger {
      color: var(--accent-red);
    }
    .btn-danger:hover {
      background-color: var(--accent-red);
      color: #ffffff;
      border-color: var(--accent-red);
    }

    .btn-blue {
      background-color: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }
    .btn-blue:hover {
      background-color: #2563eb;
    }

    /* ログコンテナ */
    .log-container {
      background-color: var(--log-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      max-height: 450px;
      overflow-y: auto;
    }

    .log-container::-webkit-scrollbar, .custom-select-options::-webkit-scrollbar {
      width: 6px;
    }
    .log-container::-webkit-scrollbar-thumb, .custom-select-options::-webkit-scrollbar-thumb {
      background: #3f3f46;
      border-radius: 4px;
    }

    .log-item {
      margin-bottom: 10px;
      line-height: 1.6;
      color: #d4d4d8;
      word-break: break-all;
    }

    .log-time {
      color: #71717a;
      margin-right: 8px;
    }

    /* 送信完了モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      max-width: 360px;
      width: 90%;
      transform: scale(0.9);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    .modal-overlay.show .modal-card {
      transform: scale(1);
    }

    .modal-icon {
      width: 60px;
      height: 60px;
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--accent-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 16px auto;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .modal-card h3 {
      margin: 0 0 8px 0;
      font-size: 1.3rem;
      color: #ffffff;
    }

    .modal-card p {
      margin: 0 0 24px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- 左側サイドメニュー -->
  <aside>
    <div class="sidebar-brand">
      🐤 piyobot
    </div>
    <ul class="sidebar-menu">
      <li class="active" id="menu-dashboard"><button onclick="switchTab('dashboard')">📊 ダッシュボード</button></li>
      <li id="menu-custom"><button onclick="switchTab('custom')">💬 カスタムメッセージ</button></li>
      <li id="menu-logs"><button onclick="switchTab('logs')">📜 稼働ログ</button></li>
      <li style="margin-top: 16px;"><a href="./" style="display:block; padding:12px 16px; color:var(--text-muted); text-decoration:none; font-size:0.95rem;">← メイン管理に戻る</a></li>
    </ul>
    <div class="sidebar-footer">
      <span style="font-size: 0.8rem; color: var(--text-muted);">Status: Online</span>
    </div>
  </aside>

  <!-- メインコンテンツエリア -->
  <main>
    <header>
      <h1 id="page-title">ダッシュボード</h1>
      <p id="page-desc">piyobot の稼働ステータスやコントロールを行います。</p>
    </header>

    <!-- 1. ダッシュボード画面 -->
    <section id="section-dashboard" class="content-section active">
      <div class="card">
        <h2>ボットステータス制御</h2>
        <div class="status-text">
          現在の状態: <span class="status-badge" id="status-badge"></span><strong id="status-label">有効 (稼働中)</strong>
        </div>
        <button class="btn btn-danger" id="toggle-btn">ボットを停止する</button>
      </div>
    </section>

    <!-- 2. カスタムメッセージ画面 -->
    <section id="section-custom" class="content-section">
      <div class="card">
        <h2>カスタムメッセージ送信</h2>
        
        <!-- サーバー選択 -->
        <div class="form-group">
          <label>送信先サーバー</label>
          <div class="custom-select-container" id="guild-dropdown">
            <div class="custom-select-trigger" id="guild-trigger">サーバーを選択してください</div>
            <div class="custom-select-options" id="guild-options"></div>
          </div>
        </div>

        <!-- チャンネル選択 -->
        <div class="form-group">
          <label>送信先チャンネル</label>
          <div class="custom-select-container" id="channel-dropdown">
            <div class="custom-select-trigger" id="channel-trigger">先にサーバーを選択してください</div>
            <div class="custom-select-options" id="channel-options"></div>
          </div>
        </div>

        <!-- アクセントカラー選択（ブラック仕様 ＆ テンプレート一覧） -->
        <div class="form-group">
          <label for="color-picker">アクセントカラー（サイドバーの色）</label>
          <div class="color-picker-wrapper">
            <div class="color-preview-box" id="color-preview" style="background-color: #32CD32;">
              <input type="color" id="color-picker" class="color-input-native" value="#32CD32">
            </div>
            <input type="text" id="color-text" class="color-text-input" value="#32CD32" placeholder="#32CD32">
          </div>
          <!-- カラーテンプレート（よく使う色をワンクリック選択） -->
          <div class="color-presets">
            <button type="button" class="color-preset-btn" style="background-color: #32CD32;" data-color="#32CD32" title="ライムグリーン"></button>
            <button type="button" class="color-preset-btn" style="background-color: #3b82f6;" data-color="#3b82f6" title="ブルー"></button>
            <button type="button" class="color-preset-btn" style="background-color: #ef4444;" data-color="#ef4444" title="レッド"></button>
            <button type="button" class="color-preset-btn" style="background-color: #eab308;" data-color="#eab308" title="イエロー"></button>
            <button type="button" class="color-preset-btn" style="background-color: #a855f7;" data-color="#a855f7" title="パープル"></button>
            <button type="button" class="color-preset-btn" style="background-color: #ec4899;" data-color="#ec4899" title="ピンク"></button>
            <button type="button" class="color-preset-btn" style="background-color: #06b6d4;" data-color="#06b6d4" title="シアン"></button>
            <button type="button" class="color-preset-btn" style="background-color: #ffffff;" data-color="#ffffff" title="ホワイト"></button>
            <button type="button" class="color-preset-btn" style="background-color: #71717a;" data-color="#71717a" title="グレー"></button>
          </div>
        </div>

        <div class="form-group">
          <label for="message-input">メッセージ内容</label>
          <textarea id="message-input" class="form-textarea" placeholder="Discordに送信するメッセージを入力してください..."></textarea>
        </div>
        <button class="btn btn-blue" id="send-msg-btn">Discordに送信</button>
      </div>
    </section>

    <!-- 3. 稼働ログ画面 -->
    <section id="section-logs" class="content-section">
      <div class="card">
        <h2>リアルタイム稼働ログ</h2>
        <div class="log-container" id="log-list">
          <div class="log-item" style="color: var(--text-muted);">ログを読み込んでいます...</div>
        </div>
      </div>
    </section>
  </main>

  <!-- 送信完了モーダル -->
  <div class="modal-overlay" id="success-modal">
    <div class="modal-card">
      <div class="modal-icon">✓</div>
      <h3>送信完了</h3>
      <p>メッセージの送信リクエストを正しく受け付けました。</p>
      <button class="btn btn-blue" style="width: 100%;" onclick="closeModal()">閉じる</button>
    </div>
  </div>

  <!-- Firebase SDK & ロジック -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      query, 
      orderBy, 
      limit, 
      onSnapshot,
      doc,
      setDoc,
      getDoc,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD4xg5pQ92oyb37YJfA3e3KmGN1q0-ThIQ",
      authDomain: "mywebsite-72df0.firebaseapp.com",
      projectId: "mywebsite-72df0",
      storageBucket: "mywebsite-72df0.firebasestorage.app",
      messagingSenderId: "538159276455",
      appId: "1:538159276455:web:3b61ea7c2b427ee6c11682",
      measurementId: "G-XGGF1946BT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // タブ切り替え
    window.switchTab = function(tabName) {
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.sidebar-menu li').forEach(li => li.classList.remove('active'));

      if (tabName === 'dashboard') {
        document.getElementById('section-dashboard').classList.add('active');
        document.getElementById('menu-dashboard').classList.add('active');
        document.getElementById('page-title').textContent = 'ダッシュボード';
        document.getElementById('page-desc').textContent = 'piyobot の稼働ステータスやコントロールを行います。';
      } else if (tabName === 'custom') {
        document.getElementById('section-custom').classList.add('active');
        document.getElementById('menu-custom').classList.add('active');
        document.getElementById('page-title').textContent = 'カスタムメッセージ';
        document.getElementById('page-desc').textContent = 'ボットが導入されているサーバーとチャンネルを選択してメッセージを送信します。';
      } else if (tabName === 'logs') {
        document.getElementById('section-logs').classList.add('active');
        document.getElementById('menu-logs').classList.add('active');
        document.getElementById('page-title').textContent = '稼働ログ';
        document.getElementById('page-desc').textContent = 'ボットの動作やイベント履歴をリアルタイムで確認できます。';
      }
    };

    window.closeModal = function() {
      document.getElementById('success-modal').classList.remove('show');
    };

    const logListEl = document.getElementById("log-list");
    const toggleBtn = document.getElementById("toggle-btn");
    const statusBadge = document.getElementById("status-badge");
    const statusLabel = document.getElementById("status-label");
    const sendMsgBtn = document.getElementById("send-msg-btn");
    const messageInput = document.getElementById("message-input");

    // カラーピッカー・プレビュー・テキスト連動
    const colorPicker = document.getElementById("color-picker");
    const colorText = document.getElementById("color-text");
    const colorPreview = document.getElementById("color-preview");

    function updateColor(colorHex) {
      colorPicker.value = colorHex;
      colorText.value = colorHex;
      colorPreview.style.backgroundColor = colorHex;
    }

    colorPicker.addEventListener("input", (e) => {
      updateColor(e.target.value);
    });

    colorText.addEventListener("input", (e) => {
      let val = e.target.value;
      if (/^#[0-9A-F]{6}$/i.test(val)) {
        updateColor(val);
      }
    });

    // カラーテンプレート（プリセット）ボタンのクリックイベント
    document.querySelectorAll(".color-preset-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        updateColor(btn.dataset.color);
      });
    });

    const guildDropdown = document.getElementById("guild-dropdown");
    const guildTrigger = document.getElementById("guild-trigger");
    const guildOptions = document.getElementById("guild-options");

    const channelDropdown = document.getElementById("channel-dropdown");
    const channelTrigger = document.getElementById("channel-trigger");
    const channelOptions = document.getElementById("channel-options");

    let loadedGuilds = [];
    let selectedChannelId = "";

    // ドロップダウン開閉の制御
    guildTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      channelDropdown.classList.remove("open");
      guildDropdown.classList.toggle("open");
    });

    channelTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!channelTrigger.dataset.enabled) return;
      guildDropdown.classList.remove("open");
      channelDropdown.classList.toggle("open");
    });

    document.addEventListener("click", () => {
      guildDropdown.classList.remove("open");
      channelDropdown.classList.remove("open");
    });

    // 1. サーバー＆チャンネル読み込み
    async function loadGuilds() {
      try {
        const docSnap = await getDoc(doc(db, "settings", "guilds_cache"));
        if (docSnap.exists()) {
          loadedGuilds = docSnap.data().guilds || [];
          guildOptions.innerHTML = "";

          loadedGuilds.forEach(g => {
            const opt = document.createElement("div");
            opt.className = "custom-option";
            opt.textContent = g.name;
            opt.addEventListener("click", () => selectGuild(g));
            guildOptions.appendChild(opt);
          });
        } else {
          guildTrigger.textContent = "サーバーが見つかりません";
        }
      } catch (e) {
        console.error("サーバー読み込みエラー:", e);
      }
    }
    loadGuilds();

    function selectGuild(guild) {
      guildTrigger.textContent = guild.name;
      guildDropdown.classList.remove("open");

      channelTrigger.textContent = "チャンネルを選択してください";
      channelTrigger.dataset.enabled = "true";
      channelOptions.innerHTML = "";
      selectedChannelId = "";

      if (guild.channels && guild.channels.length > 0) {
        guild.channels.forEach(c => {
          const opt = document.createElement("div");
          opt.className = "custom-option";
          opt.textContent = `# ${c.name}`;
          opt.addEventListener("click", () => {
            channelTrigger.textContent = `# ${c.name}`;
            selectedChannelId = c.id;
            channelDropdown.classList.remove("open");
          });
          channelOptions.appendChild(opt);
        });
      } else {
        const opt = document.createElement("div");
        opt.className = "custom-option";
        opt.style.color = "var(--text-muted)";
        opt.textContent = "利用可能なテキストチャンネルがありません";
        channelOptions.appendChild(opt);
      }
    }

    // 2. リアルタイムログ監視
    const q = query(
      collection(db, "bot_logs"), 
      orderBy("timestamp", "desc"), 
      limit(25)
    );

    onSnapshot(q, (snapshot) => {
      logListEl.innerHTML = "";
      if (snapshot.empty) {
        logListEl.innerHTML = '<div class="log-item" style="color: var(--text-muted);">ログはありません。</div>';
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        let timeStr = "";
        if (data.timestamp && data.timestamp.toDate) {
          const date = data.timestamp.toDate();
          timeStr = `[${date.getFullYear()}/${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}]`;
        } else {
          timeStr = `[直近]`;
        }

        let messageHtml = (data.message || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

        const logItem = document.createElement("div");
        logItem.className = "log-item";
        logItem.innerHTML = `<span class="log-time">${timeStr}</span> ${messageHtml}`;
        logListEl.appendChild(logItem);
      });
    });

    // 3. ボットステータス制御
    let isRunning = true;
    const statusRef = doc(db, "settings", "bot_status");

    onSnapshot(statusRef, (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        isRunning = data.running !== false;
      } else {
        setDoc(statusRef, { running: true });
        isRunning = true;
      }

      if (isRunning) {
        statusBadge.style.backgroundColor = "var(--accent-green)";
        statusBadge.style.boxShadow = "0 0 8px var(--accent-green)";
        statusLabel.textContent = "有効 (稼働中)";
        toggleBtn.textContent = "ボットを停止する";
      } else {
        statusBadge.style.backgroundColor = "var(--accent-red)";
        statusBadge.style.boxShadow = "0 0 8px var(--accent-red)";
        statusLabel.textContent = "停止中";
        toggleBtn.textContent = "ボットを再開する";
      }
    });

    toggleBtn.addEventListener("click", async () => {
      try {
        const nextState = !isRunning;
        await setDoc(statusRef, { running: nextState }, { merge: true });
      } catch (e) {
        alert("ステータスの変更に失敗しました。");
      }
    });

    // 4. メッセージ送信処理
    sendMsgBtn.addEventListener("click", async () => {
      const content = messageInput.value.trim();
      const color = colorText.value.trim() || "#32CD32";

      if (!selectedChannelId || !content) {
        alert("送信先のサーバー・チャンネルとメッセージ内容をすべて選択・入力してください。");
        return;
      }

      try {
        sendMsgBtn.disabled = true;
        sendMsgBtn.textContent = "送信中...";

        await addDoc(collection(db, "send_requests"), {
          channelId: selectedChannelId,
          content: content,
          color: color,
          status: "pending",
          createdAt: serverTimestamp()
        });

        messageInput.value = "";
        document.getElementById('success-modal').classList.add('show');
      } catch (error) {
        console.error("送信エラー:", error);
        alert("送信リクエストの追加に失敗しました。");
      } finally {
        sendMsgBtn.disabled = false;
        sendMsgBtn.textContent = "Discordに送信";
      }
    });
  </script>
</body>
</html>
